<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#334155" stroke-width="1.4"/></marker></defs><rect width="1320" height="820" fill="white"/><g font-family="Arial,sans-serif" fill="#172333"><rect x="210" y="30" width="900" height="590" fill="white" stroke="#334155"/><text x="660" y="75" text-anchor="middle" font-size="23" font-weight="bold">CdG — Despesas e recálculo do rateio</text><line x1="95" y1="332" x2="260" y2="180" stroke="#64748b" stroke-width="1.4"/><line x1="95" y1="332" x2="260" y2="335" stroke="#64748b" stroke-width="1.4"/><line x1="95" y1="332" x2="260" y2="490" stroke="#64748b" stroke-width="1.4"/><line x1="560" y1="180" x2="755" y2="335" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="608" y="215" width="104" height="23" fill="white"/><text x="660" y="231" text-anchor="middle" font-size="17">«include»</text><line x1="560" y1="335" x2="755" y2="335" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="608" y="306" width="104" height="23" fill="white"/><text x="660" y="322" text-anchor="middle" font-size="17">«include»</text><line x1="560" y1="490" x2="755" y2="335" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="608" y="404" width="104" height="23" fill="white"/><text x="660" y="420" text-anchor="middle" font-size="17">«include»</text><ellipse cx="410" cy="180" rx="150" ry="38" fill="#f1f5f9" stroke="#334155"/><text x="410" y="186.0" text-anchor="middle" font-size="18">Registrar despesa</text><ellipse cx="410" cy="335" rx="150" ry="38" fill="#f1f5f9" stroke="#334155"/><text x="410" y="341.0" text-anchor="middle" font-size="18">Editar despesa</text><ellipse cx="410" cy="490" rx="150" ry="38" fill="#f1f5f9" stroke="#334155"/><text x="410" y="496.0" text-anchor="middle" font-size="18">Excluir despesa</text><ellipse cx="905" cy="335" rx="150" ry="38" fill="#e0f2fe" stroke="#334155"/><text x="905" y="329.5" text-anchor="middle" font-size="18">Recalcular rateio</text><text x="905" y="352.5" text-anchor="middle" font-size="18">e saldos</text><g fill="white" stroke="#334155" stroke-width="2"><circle cx="95" cy="302" r="12"/><path d="M95 314V347 M70 328H120 M95 347L73 378 M95 347L117 378" fill="none"/></g><text x="95" y="405" text-anchor="middle" font-size="18">Organizador</text><text x="210" y="674" font-size="16" fill="#475569">«include»: as três operações reutilizam obrigatoriamente o recálculo após a alteração válida.</text><text x="210" y="702" font-size="16" fill="#475569">O recálculo considera a divisão de cada despesa, os adiantamentos e os acertos confirmados.</text><text x="210" y="730" font-size="16" fill="#475569">Financeiro deve estar aberto; sem participantes elegíveis, o rateio fica pendente.</text><text x="210" y="758" font-size="16" fill="#475569">Este recorte detalha RF10, RF11, RF12 e RF13; o cálculo é automático.</text></g></svg>