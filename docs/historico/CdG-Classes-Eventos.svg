<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1150" viewBox="0 0 1350 1150"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172333"><text x="50" y="48" font-size="26" font-weight="bold">CdG — 01 • Usuários, eventos e participação</text><text x="50" y="78" font-size="15" fill="#475569">Modelo de domínio • atributos, operações e multiplicidades • v1</text><rect x="60" y="140" width="350" height="244" fill="white" stroke="#334155"/><rect x="60" y="140" width="350" height="40" fill="#e0f2fe" stroke="#334155"/><text x="235.0" y="167" text-anchor="middle" font-size="19" font-weight="bold">Usuário</text><line x1="60" x2="410" y1="318" y2="318" stroke="#334155"/><text x="72" y="204" font-size="16">- id: int</text><text x="72" y="228" font-size="16">- nome: string</text><text x="72" y="252" font-size="16">- email: string</text><text x="72" y="276" font-size="16">- perfilGlobal: PerfilGlobal</text><text x="72" y="300" font-size="16">- statusConta: StatusConta</text><text x="72" y="342" font-size="16">+ atualizarPerfil()</text><text x="72" y="366" font-size="16">+ desativarConta()</text><rect x="860" y="140" width="400" height="316" fill="white" stroke="#334155"/><rect x="860" y="140" width="400" height="40" fill="#e0f2fe" stroke="#334155"/><text x="1060.0" y="167" text-anchor="middle" font-size="19" font-weight="bold">Evento</text><line x1="860" x2="1260" y1="342" y2="342" stroke="#334155"/><text x="872" y="204" font-size="16">- id: int</text><text x="872" y="228" font-size="16">- nome: string</text><text x="872" y="252" font-size="16">- dataHora: DateTime</text><text x="872" y="276" font-size="16">- local: string</text><text x="872" y="300" font-size="16">- limiteParticipantes: int [0..1]</text><text x="872" y="324" font-size="16">- status: StatusEvento</text><text x="872" y="366" font-size="16">+ editarDados()</text><text x="872" y="390" font-size="16">+ concluirEncontro()</text><text x="872" y="414" font-size="16">+ fecharFinanceiro()</text><text x="872" y="438" font-size="16">+ cancelar()</text><rect x="60" y="570" width="400" height="244" fill="white" stroke="#334155"/><rect x="60" y="570" width="400" height="40" fill="#e0f2fe" stroke="#334155"/><text x="260.0" y="597" text-anchor="middle" font-size="19" font-weight="bold">VínculoEvento</text><line x1="60" x2="460" y1="724" y2="724" stroke="#334155"/><text x="72" y="634" font-size="16">- id: int</text><text x="72" y="658" font-size="16">- papel: PapelNoEvento</text><text x="72" y="682" font-size="16">- presenca: StatusPresenca</text><text x="72" y="706" font-size="16">- /saldo: decimal</text><text x="72" y="748" font-size="16">+ confirmarPresenca()</text><text x="72" y="772" font-size="16">+ cancelarParticipacao()</text><text x="72" y="796" font-size="16">+ alterarPapel()</text><rect x="860" y="610" width="400" height="220" fill="white" stroke="#334155"/><rect x="860" y="610" width="400" height="40" fill="#e0f2fe" stroke="#334155"/><text x="1060.0" y="637" text-anchor="middle" font-size="19" font-weight="bold">Convite</text><line x1="860" x2="1260" y1="740" y2="740" stroke="#334155"/><text x="872" y="674" font-size="16">- id: int</text><text x="872" y="698" font-size="16">- enviadoEm: DateTime</text><text x="872" y="722" font-size="16">- status: StatusConvite</text><text x="872" y="764" font-size="16">+ aceitar()</text><text x="872" y="788" font-size="16">+ recusar()</text><text x="872" y="812" font-size="16">+ reenviar()</text><polyline points="410,200 860,200" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="613.0" y="169" width="44" height="21" fill="white"/><text x="635" y="185" text-anchor="middle" font-size="15">cria</text><rect x="415.0" y="207" width="32" height="21" fill="white"/><text x="431" y="223" text-anchor="middle" font-size="15">1</text><rect x="807.0" y="207" width="44" height="21" fill="white"/><text x="829" y="223" text-anchor="middle" font-size="15">0..*</text><polyline points="210,384 210,570" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="221.0" y="460" width="60" height="21" fill="white"/><text x="251" y="476" text-anchor="middle" font-size="15">possui</text><rect x="172.0" y="394" width="32" height="21" fill="white"/><text x="188" y="410" text-anchor="middle" font-size="15">1</text><rect x="158.0" y="532" width="44" height="21" fill="white"/><text x="180" y="548" text-anchor="middle" font-size="15">0..*</text><polyline points="860,450 655,450 655,680 460,680" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="624.0" y="547" width="52" height="21" fill="white"/><text x="650" y="563" text-anchor="middle" font-size="15">reúne</text><rect x="821.0" y="419" width="32" height="21" fill="white"/><text x="837" y="435" text-anchor="middle" font-size="15">1</text><rect x="471.0" y="649" width="44" height="21" fill="white"/><text x="493" y="665" text-anchor="middle" font-size="15">1..*</text><polyline points="1090,456 1090,610" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1110.0" y="523" width="60" height="21" fill="white"/><text x="1140" y="539" text-anchor="middle" font-size="15">possui</text><rect x="1053.0" y="471" width="32" height="21" fill="white"/><text x="1069" y="487" text-anchor="middle" font-size="15">1</text><rect x="1038.0" y="572" width="44" height="21" fill="white"/><text x="1060" y="588" text-anchor="middle" font-size="15">0..*</text><polyline points="410,300 730,300 730,710 860,710" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="656.0" y="487" width="148" height="21" fill="white"/><text x="730" y="503" text-anchor="middle" font-size="15">é destinatário de</text><rect x="413.0" y="307" width="32" height="21" fill="white"/><text x="429" y="323" text-anchor="middle" font-size="15">1</text><rect x="805.0" y="679" width="44" height="21" fill="white"/><text x="827" y="695" text-anchor="middle" font-size="15">0..*</text><polyline points="860,780 460,780" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="615.0" y="749" width="68" height="21" fill="white"/><text x="649" y="765" text-anchor="middle" font-size="15">origina</text><rect x="806.0" y="789" width="44" height="21" fill="white"/><text x="828" y="805" text-anchor="middle" font-size="15">0..1</text><rect x="470.0" y="789" width="44" height="21" fill="white"/><text x="492" y="805" text-anchor="middle" font-size="15">0..1</text><text x="50" y="940" font-size="16" fill="#475569">Um vínculo é único por usuário e evento; o criador recebe um vínculo de organizador ao criar o evento.</text><text x="50" y="965" font-size="16" fill="#475569">PapelNoEvento: PARTICIPANTE ou ORGANIZADOR; presença é independente do papel.</text><text x="50" y="990" font-size="16" fill="#475569">PerfilGlobal: COMUM ou ADMINISTRADOR. O criador é identificado pela associação Usuário–Evento.</text><text x="50" y="1015" font-size="16" fill="#475569">Aceitar convite cria/reutiliza o vínculo; o vínculo do criador não precisa de convite. Convites exigem conta.</text><text x="50" y="1040" font-size="16" fill="#475569">StatusEvento: PLANEJAMENTO, EM_ANDAMENTO, EM_ACERTO, FECHADO ou CANCELADO.</text><text x="50" y="1065" font-size="16" fill="#475569">StatusPresenca: PENDENTE, CONFIRMADA, RECUSADA ou CANCELADA.</text><text x="50" y="1090" font-size="16" fill="#475569">StatusConvite: ENVIADO, ACEITO ou RECUSADO; StatusConta: ATIVA ou INATIVA.</text></g></svg>