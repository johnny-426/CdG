<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#334155" stroke-width="1.4"/></marker></defs><rect width="1320" height="820" fill="white"/><g font-family="Arial,sans-serif" fill="#172333"><rect x="210" y="30" width="900" height="590" fill="white" stroke="#334155"/><text x="660" y="75" text-anchor="middle" font-size="23" font-weight="bold">CdG — Pagamentos e comprovante opcional</text><line x1="95" y1="182" x2="270" y2="220" stroke="#64748b" stroke-width="1.4"/><line x1="1200" y1="437" x2="1050" y2="470" stroke="#64748b" stroke-width="1.4"/><line x1="760" y1="220" x2="570" y2="220" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="613" y="185" width="104" height="23" fill="white"/><text x="665" y="201" text-anchor="middle" font-size="17">«extend»</text><ellipse cx="420" cy="220" rx="150" ry="38" fill="#f1f5f9" stroke="#334155"/><text x="420" y="214.5" text-anchor="middle" font-size="18">Informar pagamento</text><text x="420" y="237.5" text-anchor="middle" font-size="18">realizado</text><ellipse cx="910" cy="220" rx="150" ry="38" fill="#e0f2fe" stroke="#334155"/><text x="910" y="226.0" text-anchor="middle" font-size="18">Anexar comprovante</text><ellipse cx="900" cy="470" rx="150" ry="38" fill="#f1f5f9" stroke="#334155"/><text x="900" y="464.5" text-anchor="middle" font-size="18">Validar pagamento</text><text x="900" y="487.5" text-anchor="middle" font-size="18">informado</text><g fill="white" stroke="#334155" stroke-width="2"><circle cx="95" cy="152" r="12"/><path d="M95 164V197 M70 178H120 M95 197L73 228 M95 197L117 228" fill="none"/></g><text x="95" y="255" text-anchor="middle" font-size="18">Participante</text><g fill="white" stroke="#334155" stroke-width="2"><circle cx="1200" cy="407" r="12"/><path d="M1200 419V452 M1175 433H1225 M1200 452L1178 483 M1200 452L1222 483" fill="none"/></g><text x="1200" y="510" text-anchor="middle" font-size="18">Organizador</text><text x="210" y="674" font-size="16" fill="#475569">«extend»: anexar comprovante ocorre somente se o participante escolher enviar um arquivo.</text><text x="210" y="702" font-size="16" fill="#475569">Ponto de extensão em Informar pagamento: complementar dados antes de enviar o registro.</text><text x="210" y="730" font-size="16" fill="#475569">Validar pagamento é outra ação: exige registro aguardando confirmação e permite confirmar ou rejeitar.</text><text x="210" y="758" font-size="16" fill="#475569">O comprovante é opcional e não confirma automaticamente o recebimento.</text><text x="210" y="786" font-size="16" fill="#475569">O organizador que paga também atua como participante; esta visão mostra os papéis na operação.</text></g></svg>