><text x="912" y="660" font-size="16">- comprado: bool</text><text x="912" y="702" font-size="16">+ alterarQuantidade()</text><text x="912" y="726" font-size="16">+ marcarComprado()</text><rect x="70" y="460" width="380" height="196" fill="white" stroke="#334155"/><rect x="70" y="460" width="380" height="40" fill="#e0f2fe" stroke="#334155"/><text x="260.0" y="487" text-anchor="middle" font-size="19" font-weight="bold">Receita</text><line x1="70" x2="450" y1="614" y2="614" stroke="#334155"/><text x="82" y="524" font-size="16">- id: int</text><text x="82" y="548" font-size="16">- nome: string</text><text x="82" y="572" font-size="16">- descricao: string</text><text x="82" y="596" font-size="16">- rendimentoPessoas: int</text><text x="82" y="638" font-size="16">+ calcularProporcao(pessoas: int)</text><rect x="70" y="780" width="350" height="148" fill="white" stroke="#334155"/><rect x="70" y="780" width="350" height="40" fill="#e0f2fe" stroke="#334155"/><text x="245.0" y="807" text-anchor="middle" font-size="19" font-weight="bold">Usuário</text><line x1="70" x2="420" y1="886" y2="886" stroke="#334155"/><text x="82" y="844" font-size="16">- id: int</text><text x="82" y="868" font-size="16">- nome: string</text><text x="82" y="910" font-size="16">+ consultarNotificacoes()</text><rect x="900" y="820" width="420" height="196" fill="white" stroke="#334155"/><rect x="900" y="820" width="420" height="40" fill="#e0f2fe" stroke="#334155"/><text x="1110.0" y="847" text-anchor="middle" font-size="19" font-weight="bold">Notificação</text><line x1="900" x2="1320" y1="974" y2="974" stroke="#334155"/><text x="912" y="884" font-size="16">- id: int</text><text x="912" y="908" font-size="16">- mensagem: string</text><text x="912" y="932" font-size="16">- criadaEm: DateTime</text><text x="912" y="956" font-size="16">- lidaEm: DateTime [0..1]</text><text x="912" y="998" font-size="16">+ marcarLida()</text><polyline points="430,210 900,210" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="632.0" y="177" width="60" height="21" fill="white"/><text x="662" y="193" text-anchor="middle" font-size="15">possui</text><rect x="436.0" y="220" width="32" height="21" fill="white"/><text x="452" y="236" text-anchor="middle" font-size="15">1</text><rect x="846.0" y="220" width="44" height="21" fill="white"/><text x="868" y="236" text-anchor="middle" font-size="15">0..1</text><polyline points="1110,312 1110,500" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1127.0" y="378" width="60" height="21" fill="white"/><text x="1157" y="394" text-anchor="middle" font-size="15">contém</text><rect x="1071.0" y="323" width="32" height="21" fill="white"/><text x="1087" y="339" text-anchor="middle" font-size="15">1</text><rect x="1058.0" y="462" width="44" height="21" fill="white"/><text x="1080" y="478" text-anchor="middle" font-size="15">0..*</text><polyline points="450,550 650,550 650,255 900,255" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="616.0" y="383" width="68" height="21" fill="white"/><text x="650" y="399" text-anchor="middle" font-size="15">inspira</text><rect x="458.0" y="561" width="44" height="21" fill="white"/><text x="480" y="577" text-anchor="middle" font-size="15">0..*</text><rect x="846.0" y="262" width="44" height="21" fill="white"/><text x="868" y="278" text-anchor="middle" font-size="15">0..*</text><polyline points="420,855 900,855" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="627.0" y="820" width="60" height="21" fill="white"/><text x="657" y="836" text-anchor="middle" font-size="15">recebe</text><rect x="426.0" y="864" width="32" height="21" fill="white"/><text x="442" y="880" text-anchor="middle" font-size="15">1</text><rect x="846.0" y="864" width="44" height="21" fill="white"/><text x="868" y="880" text-anchor="middle" font-size="15">0..*</text><polyline points="430,250 755,250 755,950 900,950" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="697.0" y="639" width="116" height="21" fill="white"/><text x="755" y="655" text-anchor="middle" font-size="15">contextualiza</text><rect x="438.0" y="257" width="44" height="21" fill="white"/><text x="460" y="273" text-anchor="middle" font-size="15">0..1</text><rect x="846.0" y="959" width="44" height="21" fill="white"/><text x="868" y="975" text-anchor="middle" font-size="15">0..*</text><text x="50" y="1085" font-size="16" fill="#475569">Classes repetidas nas abas representam os mesmos conceitos; atributos omitidos aqui estão nas outras visões.</text><text x="50" y="1110" font-size="16" fill="#475569">A lista é opcional; marcar uma compra não gera despesa automaticamente. Receita é apoio opcional.</text></g></svg>