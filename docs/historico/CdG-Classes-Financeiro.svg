<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1330" viewBox="0 0 1900 1330"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172333"><text x="50" y="48" font-size="26" font-weight="bold">CdG — 02 • Despesas, rateios e acertos</text><text x="50" y="78" font-size="15" fill="#475569">Modelo de domínio • atributos, operações e multiplicidades • v1</text><rect x="60" y="140" width="330" height="172" fill="white" stroke="#334155"/><rect x="60" y="140" width="330" height="40" fill="#e0f2fe" stroke="#334155"/><text x="225.0" y="167" text-anchor="middle" font-size="19" font-weight="bold">Evento</text><line x1="60" x2="390" y1="246" y2="246" stroke="#334155"/><text x="72" y="204" font-size="16">- id: int</text><text x="72" y="228" font-size="16">- status: StatusEvento</text><text x="72" y="270" font-size="16">+ recalcularSaldos()</text><text x="72" y="294" font-size="16">+ fecharFinanceiro()</text><rect x="780" y="130" width="350" height="148" fill="white" stroke="#334155"/><rect x="780" y="130" width="350" height="40" fill="#e0f2fe" stroke="#334155"/><text x="955.0" y="157" text-anchor="middle" font-size="19" font-weight="bold">VínculoEvento</text><line x1="780" x2="1130" y1="236" y2="236" stroke="#334155"/><text x="792" y="194" font-size="16">- id: int</text><text x="792" y="218" font-size="16">- /saldo: decimal</text><text x="792" y="260" font-size="16">+ consultarSaldo()</text><rect x="60" y="580" width="370" height="244" fill="white" stroke="#334155"/><rect x="60" y="580" width="370" height="40" fill="#e0f2fe" stroke="#334155"/><text x="245.0" y="607" text-anchor="middle" font-size="19" font-weight="bold">Despesa</text><line x1="60" x2="430" y1="758" y2="758" stroke="#334155"/><text x="72" y="644" font-size="16">- id: int</text><text x="72" y="668" font-size="16">- descricao: string</text><text x="72" y="692" font-size="16">- categoria: string</text><text x="72" y="716" font-size="16">- valor: decimal</text><text x="72" y="740" font-size="16">- data: Date</text><text x="72" y="782" font-size="16">+ alterarDados()</text><text x="72" y="806" font-size="16">+ definirDivisao()</text><rect x="780" y="570" width="350" height="148" fill="white" stroke="#334155"/><rect x="780" y="570" width="350" height="40" fill="#e0f2fe" stroke="#334155"/><text x="955.0" y="597" text-anchor="middle" font-size="19" font-weight="bold">ParcelaDespesa</text><line x1="780" x2="1130" y1="676" y2="676" stroke="#334155"/><text x="792" y="634" font-size="16">- id: int</text><text x="792" y="658" font-size="16">- valorDevido: decimal</text><text x="792" y="700" font-size="16">+ ajustarValor()</text><rect x="1430" y="140" width="410" height="244" fill="white" stroke="#334155"/><rect x="1430" y="140" width="410" height="40" fill="#e0f2fe" stroke="#334155"/><text x="1635.0" y="167" text-anchor="middle" font-size="19" font-weight="bold">Pagamento</text><line x1="1430" x2="1840" y1="318" y2="318" stroke="#334155"/><text x="1442" y="204" font-size="16">- id: int</text><text x="1442" y="228" font-size="16">- valor: decimal</text><text x="1442" y="252" font-size="16">- informadoEm: DateTime</text><text x="1442" y="276" font-size="16">- comprovante: string [0..1]</text><text x="1442" y="300" font-size="16">- status: StatusPagamento</text><text x="1442" y="342" font-size="16">+ confirmar()</text><text x="1442" y="366" font-size="16">+ rejeitar()</text><rect x="1430" y="620" width="410" height="172" fill="white" stroke="#334155"/><rect x="1430" y="620" width="410" height="40" fill="#e0f2fe" stroke="#334155"/><text x="1635.0" y="647" text-anchor="middle" font-size="19" font-weight="bold">ContribuiçãoExtra</text><line x1="1430" x2="1840" y1="750" y2="750" stroke="#334155"/><text x="1442" y="684" font-size="16">- id: int</text><text x="1442" y="708" font-size="16">- valor: decimal</text><text x="1442" y="732" font-size="16">- criadaEm: DateTime</text><text x="1442" y="774" font-size="16">+ registrar()</text><rect x="780" y="925" width="350" height="148" fill="white" stroke="#334155"/><rect x="780" y="925" width="350" height="40" fill="#e0f2fe" stroke="#334155"/><text x="955.0" y="952" text-anchor="middle" font-size="19" font-weight="bold">DestinaçãoContribuição</text><line x1="780" x2="1130" y1="1031" y2="1031" stroke="#334155"/><text x="792" y="989" font-size="16">- id: int</text><text x="792" y="1013" font-size="16">- valor: decimal</text><text x="792" y="1055" font-size="16">+ registrar()</text><polyline points="390,200 780,200" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="554.0" y="168" width="52" height="21" fill="white"/><text x="580" y="184" text-anchor="middle" font-size="15">reúne</text><rect x="394.0" y="206" width="32" height="21" fill="white"/><text x="410" y="222" text-anchor="middle" font-size="15">1</text><rect x="726.0" y="206" width="44" height="21" fill="white"/><text x="748" y="222" text-anchor="middle" font-size="15">1..*</text><polyline points="210,312 210,580" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="227.0" y="434" width="60" height="21" fill="white"/><text x="257" y="450" text-anchor="middle" font-size="15">possui</text><rect x="174.0" y="321" width="32" height="21" fill="white"/><text x="190" y="337" text-anchor="middle" font-size="15">1</text><rect x="158.0" y="542" width="44" height="21" fill="white"/><text x="180" y="558" text-anchor="middle" font-size="15">0..*</text><polyline points="780,225 565,225 565,645 430,645" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="507.0" y="391" width="116" height="21" fill="white"/><text x="565" y="407" text-anchor="middle" font-size="15">paga a compra</text><rect x="742.0" y="230" width="32" height="21" fill="white"/><text x="758" y="246" text-anchor="middle" font-size="15">1</text><rect x="440.0" y="615" width="44" height="21" fill="white"/><text x="462" y="631" text-anchor="middle" font-size="15">0..*</text><polyline points="430,680 780,680" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="546.0" y="649" width="116" height="21" fill="white"/><text x="604" y="665" text-anchor="middle" font-size="15">é dividida em</text><rect x="435.0" y="690" width="32" height="21" fill="white"/><text x="451" y="706" text-anchor="middle" font-size="15">1</text><rect x="726.0" y="690" width="44" height="21" fill="white"/><text x="748" y="706" text-anchor="middle" font-size="15">0..*</text><polyline points="925,278 925,570" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="941.0" y="436" width="60" height="21" fill="white"/><text x="971" y="452" text-anchor="middle" font-size="15">assume</text><rect x="885.0" y="286" width="32" height="21" fill="white"/><text x="901" y="302" text-anchor="middle" font-size="15">1</text><rect x="877.0" y="532" width="44" height="21" fill="white"/><text x="899" y="548" text-anchor="middle" font-size="15">0..*</text><polyline points="1130,170 1430,170" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1240.0" y="139" width="68" height="21" fill="white"/><text x="1274" y="155" text-anchor="middle" font-size="15">pagador</text><rect x="1132.0" y="179" width="32" height="21" fill="white"/><text x="1148" y="195" text-anchor="middle" font-size="15">1</text><rect x="1377.0" y="179" width="44" height="21" fill="white"/><text x="1399" y="195" text-anchor="middle" font-size="15">0..*</text><polyline points="1130,225 1430,225" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1232.0" y="195" width="84" height="21" fill="white"/><text x="1274" y="211" text-anchor="middle" font-size="15">recebedor</text><rect x="1132.0" y="231" width="32" height="21" fill="white"/><text x="1148" y="247" text-anchor="middle" font-size="15">1</text><rect x="1377.0" y="231" width="44" height="21" fill="white"/><text x="1399" y="247" text-anchor="middle" font-size="15">0..*</text><polyline points="1130,265 1280,265 1280,350 1430,350" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1248.0" y="308" width="84" height="21" fill="white"/><text x="1290" y="324" text-anchor="middle" font-size="15">validador</text><rect x="1137.0" y="273" width="44" height="21" fill="white"/><text x="1159" y="289" text-anchor="middle" font-size="15">0..1</text><rect x="1377.0" y="359" width="44" height="21" fill="white"/><text x="1399" y="375" text-anchor="middle" font-size="15">0..*</text><polyline points="1130,200 1220,200 1220,665 1430,665" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1142.0" y="490" width="156" height="21" fill="white"/><text x="1220" y="506" text-anchor="middle" font-size="15">titular do crédito</text><rect x="1134.0" y="170" width="32" height="21" fill="white"/><text x="1150" y="186" text-anchor="middle" font-size="15">1</text><rect x="1377.0" y="632" width="44" height="21" fill="white"/><text x="1399" y="648" text-anchor="middle" font-size="15">0..*</text><polyline points="390,260 480,260 480,875 1650,875 1650,792" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="581.0" y="842" width="60" height="21" fill="white"/><text x="611" y="858" text-anchor="middle" font-size="15">possui</text><rect x="394.0" y="266" width="32" height="21" fill="white"/><text x="410" y="282" text-anchor="middle" font-size="15">1</text><rect x="1662.0" y="822" width="44" height="21" fill="white"/><text x="1684" y="838" text-anchor="middle" font-size="15">0..*</text><polyline points="1430,750 1370,750 1370,1020 1130,1020" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="1210.0" y="986" width="140" height="21" fill="white"/><text x="1280" y="1002" text-anchor="middle" font-size="15">é distribuída em</text><rect x="1383.0" y="720" width="32" height="21" fill="white"/><text x="1399" y="736" text-anchor="middle" font-size="15">1</text><rect x="1143.0" y="1031" width="44" height="21" fill="white"/><text x="1165" y="1047" text-anchor="middle" font-size="15">1..*</text><polyline points="780,250 680,250 680,1020 780,1020" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="626.0" y="809" width="108" height="21" fill="white"/><text x="680" y="825" text-anchor="middle" font-size="15">beneficiário</text><rect x="742.0" y="258" width="32" height="21" fill="white"/><text x="758" y="274" text-anchor="middle" font-size="15">1</text><rect x="725.0" y="1031" width="44" height="21" fill="white"/><text x="747" y="1047" text-anchor="middle" font-size="15">0..*</text><text x="50" y="1120" font-size="16" fill="#475569">/saldo é derivado: despesas pagas − parcelas devidas + pagamentos enviados − recebidos − ajuda oferecida + ajuda recebida.</text><text x="50" y="1145" font-size="16" fill="#475569">Saldo positivo: a receber. Saldo negativo: a pagar. Apenas pagamentos confirmados entram no cálculo.</text><text x="50" y="1170" font-size="16" fill="#475569">Despesa tem um pagador; seus rateios devem somar o valor da despesa. Sem divisão definida, ela fica pendente.</text><text x="50" y="1195" font-size="16" fill="#475569">Pagamento: AGUARDANDO_CONFIRMACAO, CONFIRMADO ou REJEITADO; pagador e recebedor são vínculos distintos do mesmo evento.</text><text x="50" y="1220" font-size="16" fill="#475569">Validador deve ser organizador do evento. Despesas, parcelas, pagamentos e contribuições não podem cruzar eventos.</text><text x="50" y="1245" font-size="16" fill="#475569">A contribuição reduz o crédito do titular e as dívidas dos beneficiários; suas destinações devem somar o valor oferecido.</text><text x="50" y="1270" font-size="16" fill="#475569">O fechamento exige divisões completas, saldos zerados e ausência de pagamentos aguardando confirmação.</text></g></svg>