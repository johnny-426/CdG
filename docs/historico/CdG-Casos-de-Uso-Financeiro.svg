<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1124" viewBox="0 0 1200 1124"><rect width="1200" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172333" stroke="#334155"><rect x="240" y="25" width="720" height="954" fill="white"/><text x="600" y="65" text-anchor="middle" stroke="none" font-size="20" font-weight="bold">CdG — 03 - Despesas e acertos</text><line x1="1070" y1="432" x2="810" y2="130" stroke="#64748b"/><ellipse cx="600" cy="130" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="135" text-anchor="middle" stroke="none" font-size="16">Gerenciar despesas e identificar pagador</text><line x1="1070" y1="432" x2="810" y2="216" stroke="#64748b"/><ellipse cx="600" cy="216" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="221" text-anchor="middle" stroke="none" font-size="16">Configurar divisão de cada despesa</text><line x1="130" y1="432" x2="390" y2="302" stroke="#64748b"/><line x1="1070" y1="432" x2="810" y2="302" stroke="#64748b"/><ellipse cx="600" cy="302" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="307" text-anchor="middle" stroke="none" font-size="16">Consultar despesas e saldo individual</text><line x1="130" y1="432" x2="390" y2="388" stroke="#64748b"/><line x1="1070" y1="432" x2="810" y2="388" stroke="#64748b"/><ellipse cx="600" cy="388" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="393" text-anchor="middle" stroke="none" font-size="16">Informar pagamento realizado</text><line x1="1070" y1="432" x2="810" y2="474" stroke="#64748b"/><ellipse cx="600" cy="474" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="479" text-anchor="middle" stroke="none" font-size="16">Validar pagamento informado</text><line x1="130" y1="432" x2="390" y2="560" stroke="#64748b"/><line x1="1070" y1="432" x2="810" y2="560" stroke="#64748b"/><ellipse cx="600" cy="560" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="565" text-anchor="middle" stroke="none" font-size="16">Oferecer contribuição extra</text><line x1="1070" y1="432" x2="810" y2="646" stroke="#64748b"/><ellipse cx="600" cy="646" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="651" text-anchor="middle" stroke="none" font-size="16">Concluir encontro</text><line x1="1070" y1="432" x2="810" y2="732" stroke="#64748b"/><ellipse cx="600" cy="732" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="737" text-anchor="middle" stroke="none" font-size="16">Fechar financeiro</text><line x1="1070" y1="432" x2="810" y2="818" stroke="#64748b"/><ellipse cx="600" cy="818" rx="210" ry="30" fill="#f1f5f9"/><text x="600" y="823" text-anchor="middle" stroke="none" font-size="16">Emitir relatório final</text><g stroke-width="2"><circle cx="130" cy="402" r="12" fill="white"/><path d="M130 414V447 M105 428H155 M130 447L108 478 M130 447L152 478" fill="none"/></g><text x="130" y="503" text-anchor="middle" stroke="none" font-size="16">Participante</text><g stroke-width="2"><circle cx="1070" cy="402" r="12" fill="white"/><path d="M1070 414V447 M1045 428H1095 M1070 447L1048 478 M1070 447L1092 478" fill="none"/></g><text x="1070" y="503" text-anchor="middle" stroke="none" font-size="16">Organizador</text><text x="240" y="1019" stroke="none" font-size="14">Contribuição extra: somente o titular pode dispor do próprio crédito.</text><text x="240" y="1041" stroke="none" font-size="14">Validar pagamento permite confirmar ou rejeitar. Relatório final exige financeiro fechado.</text><text x="240" y="1063" stroke="none" font-size="14">Fechamento exige saldos zerados e ausência de pagamentos aguardando validação.</text></g></svg>